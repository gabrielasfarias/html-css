<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pseudoclasses</title>
    <style>
        div{
            display: inline-block;
            border: 1px solid black;
            width: 100px;
            height: 100px;
            background-color: yellow;
            text-align: center;
            padding: 5px;
        }
        div:hover{
            background-color: rgb(64, 216, 64);
        }
    </style>
</head>
<body>
    <div>1</div>
    <div>2</div>
    <div>3</div>
</body>
</html>
