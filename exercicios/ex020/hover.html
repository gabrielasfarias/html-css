    <title>Document</title>
    <style>
        div:hover{
            color: red;
        }
        div > p{
            display: none;
        }
        div:hover > p{
            display: block;
            background-color: red;
            color: white;
            width: 200px;
        }
        a{
            text-decoration: underline;
        }
        a:visited{
            color: red;
        }
        a:active{
            color:palevioletred;
        }
    </style>
</head>
