<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        table{
            border-collapse: collapse;
            width: 300px;
        }
        th,td{border: 1px solid black;
        
            padding: 5px;

        }
        tfoot{
            background-color: grey;
            color: white;
        }
        tbody > tr:nth-child(2n){background-color: rgba(128, 128, 128, 0.167);

        }
    </style>
</head>
<body>
    <h1>Uso de tabelas grandes</h1>
    <table>
        <thead>
           <tr>
            <th>Estado</th>
            <th style="width: 100px;">População</th>
           </tr>
           <tr>
            <td>Rio Grande do Sul</td>
            <td>11 377 239</td>
           </tr>

        </thead>
        <tbody>
<tr>
    <td>São Paulo</td>
    <td>49 919 049</td>
</tr>
<tr>
    <td>Minas Gerais</td>
    <td>21 168 791</td>
</tr>
<tr>
    <td>Rio de Janeiro</td>
    <td>17 264 943</td>
</tr>
<tr>
    <td>Bahia</td>
    <td>14 873 064</td>
</tr>
<tr>
    <td>Paraná</td>
    <td>11 433 957</td>
</tr>
        </tbody>
        <tfoot>
            <th>
                Total de habitantes
            </th>
            <td>0000</td>
        </tfoot>
    </table>
</body>
</html>
