<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        .conteiner{
            background-color: salmon;
            display: flex;
            flex-flow: row wrap;
        }
        .item{
            background-color:aquamarine;
            border: 1px solid black;
            text-align: center;
            flex-basis: 200px;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">A de amor</div>
        <div class="item">B</div>
        <div class="item">C de coração</div>
        <div class="item">D</div>
        <div class="item ">E de escola</div>
        <div class="item ">F</div>
        <div class="item ">G</div>
    </div>
</body>
</html>
